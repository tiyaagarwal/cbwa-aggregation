[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbwa"
version = "1.0.0"
description = "Reference implementation of Class-Balance-Aware Weighted Aggregation (CBWA) for federated learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Chaitanya Patil" }]
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/tiyaagarwal/cbwa-aggregation"

[tool.setuptools]
packages = ["cbwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
